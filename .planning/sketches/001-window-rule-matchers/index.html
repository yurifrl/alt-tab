<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 001 — Window rule matchers</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  body{margin:0;background:#f4f4f5;font-family:var(--font-sans);color:var(--mac-text);-webkit-font-smoothing:antialiased}
  button,input,select{font-family:inherit}

  /* ---- variant nav ---- */
  #variant-nav{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff;border-bottom:1px solid #e4e4e7;z-index:9998;font-size:13px}
  #variant-nav .brand{font-weight:600;color:var(--mac-muted);margin-right:6px;font-size:12.5px}
  .variant-tab{border:1px solid #d8d8dc;background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--mac-text-2);cursor:pointer;transition:all .15s ease}
  .variant-tab:hover{background:#f4f4f5}
  .variant-tab.active{background:#1d1d1f;border-color:#1d1d1f;color:#fff}

  .stage{padding:64px 20px 56px;display:flex;justify-content:center;transform-origin:top center}
  .variant{display:none}
  .variant.active{display:block}

  /* ---- window ---- */
  .window{width:680px;background:var(--mac-window);border:1px solid rgba(0,0,0,.18);border-radius:12px;box-shadow:var(--sh-window);overflow:hidden;user-select:none}
  .titlebar{height:38px;display:flex;align-items:center;padding:0 14px;position:relative}
  .lights{display:flex;gap:8px}
  .light{width:12px;height:12px;border-radius:50%}
  .light.r{background:#ff5f57}.light.y{background:#febc2e}.light.g{background:#28c840}
  .wtitle{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:#6e6e73}
  .content{display:flex;min-height:560px}
  .sidebar{width:190px;border-right:1px solid var(--mac-sep);padding:10px 8px;box-sizing:border-box}
  .lrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;margin-bottom:2px}
  .lrow.sel{background:var(--mac-sel)}
  .licon{width:24px;height:24px;border-radius:6px;background:#2f2f31;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;flex:none;letter-spacing:.5px}
  .lname{font-size:13px;color:var(--mac-text)}
  .lsub{font-size:11px;color:var(--mac-muted);margin-top:1px}
  .detail{flex:1;padding:16px 20px 18px;box-sizing:border-box;min-width:0}

  /* ---- form ---- */
  .fhead{display:flex;align-items:center;gap:10px}
  .ficon{width:28px;height:28px;border-radius:7px;font-size:10px}
  .fname{font-size:15px;font-weight:600}
  .fbundle{font-size:11px;color:var(--mac-muted);margin-top:1px}
  .seclabel{font-size:10.5px;font-weight:600;color:var(--mac-muted);letter-spacing:.4px;margin:16px 0 6px}
  .fhead + .seclabel{margin-top:14px}

  .seg{display:flex;background:var(--mac-track);border:1px solid #d0d0d3;border-radius:6px;padding:2px;gap:1px}
  .seg-item{flex:1;text-align:center;font-size:13px;padding:3px 0;border-radius:4.5px;color:var(--mac-text-2);cursor:pointer;transition:background .12s ease}
  .seg-item:hover{background:rgba(255,255,255,.6)}
  .seg-item.sel{background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.10)}

  .cap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mac-muted);margin:10px 0 2px}

  .popup{position:relative;display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--mac-border);border-radius:5px;height:22px;padding:0 5px 0 7px;font-size:13px;color:var(--mac-text);cursor:pointer;box-shadow:var(--sh-control);transition:background .12s ease}
  .popup:hover{background:#f6f6f7}
  .popup.open{background:#ececee}
  .mini-popup{height:18px;font-size:11px;padding:0 4px 0 6px;border-radius:4.5px;box-shadow:none}
  .chev{width:8px;height:11px;position:relative;flex:none}
  .chev::before,.chev::after{content:"";position:absolute;left:0;border-left:4px solid transparent;border-right:4px solid transparent}
  .chev::before{top:1px;border-bottom:5px solid var(--mac-accent)}
  .chev::after{bottom:1px;border-top:5px solid var(--mac-accent)}
  .chev.small::before{border-bottom-width:4px;border-left-width:3.5px;border-right-width:3.5px}
  .chev.small::after{border-top-width:4px;border-left-width:3.5px;border-right-width:3.5px}

  .mrow-wrap{margin-top:6px}
  .mrow{display:flex;align-items:center;gap:6px}
  .tfield{flex:1;min-width:0;height:22px;border:1px solid var(--mac-border);border-radius:5px;background:#fff;font-size:13px;padding:0 6px;color:var(--mac-text);box-sizing:border-box}
  .tfield:focus,.chip .cpat:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2.5px rgba(59,130,246,.22)}
  .tfield.mono,.chip .cpat.mono{font-family:var(--font-mono);font-size:12.5px}
  .tfield.invalid{border-color:#e5484d;box-shadow:0 0 0 2.5px rgba(229,72,77,.16)}
  .rowerr{font-size:11px;color:var(--mac-danger);margin:3px 0 0 94px}
  .rowerr[hidden]{display:none}

  .sqbtn{width:22px;height:22px;flex:none;border:1px solid var(--mac-border);background:linear-gradient(#fff,#f6f6f6);border-radius:5px;font-size:13px;line-height:1;color:var(--mac-text-2);cursor:pointer;box-shadow:var(--sh-control);transition:background .12s ease}
  .sqbtn:hover{background:#efeff1}
  .sqbtn:disabled,.btn:disabled{opacity:.45;cursor:default}
  .btn{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border:1px solid var(--mac-border);background:linear-gradient(#fff,#f6f6f6);border-radius:5px;font-size:12.5px;color:var(--mac-text);cursor:pointer;box-shadow:var(--sh-control);transition:background .12s ease}
  .btn:hover{background:#efeff1}
  .btn:active,.sqbtn:active{background:#e6e6e8}
  .detail > .add-matcher{margin-top:8px}

  .well{background:#f6f6f7;border:1px solid var(--mac-border-soft);border-radius:8px;padding:8px;margin-top:4px}
  .well .mrow-wrap:first-child{margin-top:0}
  .wellfoot{display:flex;align-items:center;margin-top:8px;padding-top:7px;border-top:1px solid #e3e3e5}

  .count{font-size:11px;color:var(--mac-muted);margin-top:7px}
  .caprow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mac-muted);margin:10px 0 2px}
  .caprow .add-matcher{margin-left:auto;width:20px;height:20px;font-size:13px}

  .chipbox{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#fff;border:1px solid var(--mac-border);border-radius:6px;padding:4px 6px;min-height:32px;margin-top:4px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:#f1f1f2;border:1px solid #d2d2d4;border-radius:5px;height:21px;padding:0 4px 0 7px;font-size:12px}
  .chip .ckind{color:var(--mac-muted);font-size:10.5px;cursor:pointer;border-radius:3px;padding:0 2px}
  .chip .ckind:hover{color:var(--mac-text);background:#e4e4e6}
  .chip .cpat{border:none;outline:none;background:transparent;font-size:12px;padding:0;min-width:2ch}
  .chip .cpat:focus{box-shadow:none}
  .chip .cpat.invalid{color:var(--mac-danger)}
  .chip .cx{color:#9a9a9e;font-size:9px;cursor:pointer;padding:0 3px}
  .chip .cx:hover{color:var(--mac-text)}
  .chipinput{border:none;outline:none;font-size:12.5px;flex:1;min-width:110px;height:22px;background:transparent}

  .arow{display:flex;align-items:center;gap:8px}
  .letterchip{width:22px;height:22px;border:1px solid var(--mac-border);border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--mac-muted);flex:none}
  .dots{display:flex;align-items:center;gap:13px;padding:3px 2px}
  .dot{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s ease}
  .dot:hover{transform:scale(1.15)}
  .dot.wheel{background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7be,#0a84ff,#bf5af2,#ff2d55,#ff3b30);box-shadow:inset 0 0 0 3px #fff,0 0 0 1px #c9c9c9;box-sizing:border-box}
  .dot.eyedrop{background:#fff}
  .dot.seldot{box-shadow:0 0 0 2px #fff,0 0 0 3.5px rgba(10,108,255,.55)}
  .vis{display:flex;align-items:center;gap:8px;font-size:13px}
  .switch{width:26px;height:15px;border-radius:8px;background:var(--mac-success);position:relative;flex:none}
  .switch .knob{position:absolute;top:1.5px;right:1.5px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.25)}
  .remove-rule{margin-top:16px}

  .pvcap{font-size:10.5px;font-weight:600;color:var(--mac-muted);letter-spacing:.4px;margin:18px 0 6px}
  .pvpanel{display:flex;align-items:center;gap:9px;background:#1e1e20;border-radius:8px;padding:9px 11px}
  .pvtext{flex:1;min-width:0}
  .pvname{font-size:13px;font-weight:600;color:#fff}
  .pvsub{font-size:11px;color:#9a9a9e;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pvdot{width:9px;height:9px;border-radius:50%;background:#0a6cff;flex:none}

  .menu{position:absolute;top:100%;left:0;margin-top:3px;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.22);padding:4px;z-index:70;min-width:118px}
  .mitem{font-size:13px;padding:3px 9px 3px 22px;border-radius:4px;position:relative;cursor:pointer;white-space:nowrap}
  .mitem:hover{background:var(--mac-accent);color:#fff}
  .mitem.sel::before{content:"✓";position:absolute;left:7px}

  body.annotate [data-ann]{outline:1.5px dashed rgba(10,110,255,.8);outline-offset:2px;border-radius:2px}

  #sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font-family:system-ui;font-size:12px;background:rgba(0,0,0,.72);color:#fff;padding:7px 10px;border-radius:9px;display:flex;gap:7px;align-items:center;opacity:.45;transition:opacity .2s}
  #sketch-tools:hover{opacity:1}
  #sketch-tools select,#sketch-tools button{font-size:11.5px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:2px 7px;cursor:pointer}
  #sketch-tools button.on{background:var(--mac-accent);border-color:var(--mac-accent)}
</style>
</head>
<body>

<div id="variant-nav">
  <span class="brand">Sketch 001 · window rule matchers</span>
  <button class="variant-tab" data-v="a">A · Stacked rows</button>
  <button class="variant-tab" data-v="b">B · Boxed list ★</button>
  <button class="variant-tab" data-v="c">C · Token chips</button>
</div>

<div class="stage">
  <div class="variant" data-variant="a"></div>
  <div class="variant" data-variant="b"></div>
  <div class="variant" data-variant="c"></div>
</div>

<div id="sketch-tools">
  <select id="theme-switcher" title="Theme">
    <option value="default">Default</option>
  </select>
  <button data-zoom="1" class="on">Fit</button>
  <button data-zoom="1.25">125%</button>
  <button data-zoom="1.5">150%</button>
  <button id="ann-toggle">Annotate</button>
</div>

<script>
const KINDS = ["Contains", "Exact", "Starts with", "Ends with", "Regex"];
const WINDOWS = ["(Dev) — Slack", "PR #42 · fix panel flicker — GitHub", "README.md — alt-tab", "Releases — alt-tab", "Inbox (3) — Mail"];
const SAMPLE = [["Contains", "(Dev)"], ["Regex", "^PR #\\d+"]];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const CHEV = '<span class="chev"></span>';
const DROPPER = '<svg width="11" height="11" viewBox="0 0 16 16"><path d="M10.8 1.9l3.3 3.3-1.3 1.3-.7-.7-5 5c-.2.2-.5.3-.8.3H4.1L2.6 12.6l-1.2-1.2 1.5-1.5V7.7c0-.3.1-.6.3-.8l5-5-.7-.7 1.3-1.3z" fill="#6e6e73"/></svg>';
const NONEDOT = '<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.8" fill="none" stroke="#a5a5aa" stroke-width="1.4"/><line x1="3" y1="11" x2="11" y2="3" stroke="#a5a5aa" stroke-width="1.4"/></svg>';

function rowHTML(kind, val) {
  return '<div class="mrow-wrap"><div class="mrow">' +
    '<div class="popup kind-popup" data-ann><span class="plabel">' + kind + '</span>' + CHEV + '</div>' +
    '<input class="tfield pattern' + (kind === "Regex" ? " mono" : "") + '" value="' + esc(val) + '" placeholder="' + (kind === "Regex" ? "Regular expression" : "Window title") + '" spellcheck="false">' +
    '<button class="sqbtn remove-matcher" title="Remove this matcher">−</button>' +
    '</div><div class="rowerr" hidden></div></div>';
}

function chipHTML(kind, val) {
  const w = Math.max(String(val).length, 3) + 1;
  return '<span class="chip" data-kind="' + kind + '">' +
    '<span class="ckind" title="Change matcher kind">' + kind + '</span>' +
    '<input class="cpat' + (kind === "Regex" ? " mono" : "") + '" style="width:' + w + 'ch" value="' + esc(val) + '" spellcheck="false">' +
    '<span class="cx" title="Remove">✕</span></span>';
}

const rowsHTML = () => SAMPLE.map(p => rowHTML(p[0], p[1])).join("");
const chipsHTML = () => SAMPLE.map(p => chipHTML(p[0], p[1])).join("");
const CAP = '<div class="cap">Match <span class="popup mini-popup mode-popup" data-ann><span class="plabel" data-state="any">any</span><span class="chev small"></span></span> of the following:</div>';

const SIDEBAR =
  '<div class="sidebar">' +
    '<div class="lrow"><div class="licon" style="background:#111">>_</div><div><div class="lname">iTerm</div><div class="lsub">alt-tab</div></div></div>' +
    '<div class="lrow"><div class="licon" style="background:#4a154b">S</div><div><div class="lname">Slack</div><div class="lsub">(Dev)</div></div></div>' +
    '<div class="lrow sel"><div class="licon">>_</div><div><div class="lname">Ghostty</div><div class="lsub">README.md</div></div></div>' +
  '</div>';

const FORM_TOP =
  '<div class="fhead"><div class="licon ficon">>_</div><div><div class="fname">Ghostty</div><div class="fbundle">com.mitchellh.ghostty</div></div></div>' +
  '<div class="seclabel">APPLIES TO</div>' +
  '<div class="seg" data-ann><div class="seg-item">This window</div><div class="seg-item sel">Title matches</div><div class="seg-item">All windows</div></div>';

const FORM_BOTTOM =
  '<div class="seclabel">ALIAS</div>' +
  '<div class="arow"><input class="tfield alias" value="Term" spellcheck="false"><span class="letterchip">T</span></div>' +
  '<div class="seclabel">COLOR</div>' +
  '<div class="dots">' +
    '<span class="dot wheel" title="Pick any color"></span>' +
    '<span class="dot eyedrop" title="Pick a color off the screen">' + DROPPER + '</span>' +
    '<span class="dot" title="No color">' + NONEDOT + '</span>' +
    '<span class="dot" style="background:#ff3b30"></span>' +
    '<span class="dot" style="background:#ff9500"></span>' +
    '<span class="dot" style="background:#ffd60a"></span>' +
    '<span class="dot" style="background:#34c759"></span>' +
    '<span class="dot seldot" style="background:#0a6cff"></span>' +
    '<span class="dot" style="background:#bf5af2"></span>' +
    '<span class="dot" style="background:#ff375f"></span>' +
  '</div>' +
  '<div class="seclabel">VISIBILITY</div>' +
  '<div class="vis"><span class="switch"><span class="knob"></span></span><span>Hide from the switcher</span></div>' +
  '<button class="btn remove-rule">Remove customization</button>' +
  '<div class="pvcap">PREVIEW — HOW IT LOOKS IN THE SWITCHER</div>' +
  '<div class="pvpanel"><div class="licon">>_</div><div class="pvtext"><div class="pvname">Term</div><div class="pvsub">Ghostty</div></div><span class="pvdot"></span></div>';

const MATCHERS = {
  a: CAP +
     '<div class="matchers" data-ann>' + rowsHTML() + '</div>' +
     '<button class="btn add-matcher" data-ann>+ Add matcher</button>' +
     '<div class="count" data-ann></div>',
  b: CAP +
     '<div class="well" data-ann><div class="matchers">' + rowsHTML() + '</div>' +
       '<div class="wellfoot"><button class="btn add-matcher">+ Add matcher</button></div></div>' +
     '<div class="count" data-ann></div>',
  c: '<div class="caprow">Match <span class="popup mini-popup mode-popup" data-ann><span class="plabel" data-state="any">any</span><span class="chev small"></span></span> of the following:' +
       '<button class="sqbtn add-matcher" data-ann title="Add a matcher">+</button></div>' +
     '<div class="chipbox" data-ann>' + chipsHTML() + '<input class="chipinput" placeholder="Add a pattern…" spellcheck="false"></div>' +
     '<div class="rowerr chip-err" hidden></div>' +
     '<div class="count" data-ann></div>'
};

function windowHTML(key) {
  return '<div class="window">' +
    '<div class="titlebar"><span class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></span><span class="wtitle">Windows</span></div>' +
    '<div class="content">' + SIDEBAR + '<div class="detail">' + FORM_TOP + MATCHERS[key] + FORM_BOTTOM + '</div></div>' +
  '</div>';
}

/* ---- popup menus ---- */
let openMenuEl = null;
function closeMenu() {
  if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
  document.querySelectorAll(".popup.open").forEach(p => p.classList.remove("open"));
}
function openMenu(anchor, items, selected, cb) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu";
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "mitem" + (it === selected ? " sel" : "");
    d.textContent = it;
    d.addEventListener("mousedown", ev => { ev.preventDefault(); closeMenu(); cb(it); });
    m.appendChild(d);
  });
  anchor.appendChild(m);
  anchor.classList.add("open");
  const win = anchor.closest(".window");
  if (win) {
    const mr = m.getBoundingClientRect(), wr = win.getBoundingClientRect();
    if (mr.right > wr.right - 8) { m.style.left = "auto"; m.style.right = "0"; }
  }
  openMenuEl = m;
}
document.addEventListener("mousedown", e => {
  if (!e.target.closest(".menu") && !e.target.closest(".popup") && !e.target.closest(".ckind")) closeMenu();
});

/* ---- live matching against fake windows ---- */
function pred(kind, p, w) {
  switch (kind) {
    case "Contains": return w.includes(p);
    case "Exact": return w === p;
    case "Starts with": return w.startsWith(p);
    case "Ends with": return w.endsWith(p);
    case "Regex": try { return new RegExp(p).test(w); } catch (_) { return false; }
  }
  return false;
}
function isBadRegex(kind, p) {
  if (kind !== "Regex" || p.trim() === "") return false;
  try { new RegExp(p); return false; } catch (_) { return true; }
}

function refresh(v) {
  const segItems = [...v.querySelectorAll(".seg-item")];
  const segIdx = segItems.findIndex(s => s.classList.contains("sel"));
  const active = segIdx === 1;
  const box = v.querySelector(".matchers") || v.querySelector(".chipbox");
  if (box) {
    box.style.opacity = active ? "" : ".45";
    box.style.pointerEvents = active ? "" : "none";
  }
  v.querySelectorAll(".add-matcher").forEach(b => b.disabled = !active);

  const tests = [];
  v.querySelectorAll(".mrow").forEach(r => {
    const kind = r.querySelector(".kind-popup .plabel").textContent.trim();
    const inp = r.querySelector(".pattern");
    const bad = isBadRegex(kind, inp.value);
    inp.classList.toggle("invalid", bad);
    const errEl = r.closest(".mrow-wrap").querySelector(".rowerr");
    errEl.hidden = !bad;
    if (bad) errEl.textContent = "Invalid regular expression";
    tests.push({ kind, p: inp.value, bad });
  });
  v.querySelectorAll(".chip").forEach(c => {
    const kind = c.dataset.kind;
    const inp = c.querySelector(".cpat");
    const bad = isBadRegex(kind, inp.value);
    inp.classList.toggle("invalid", bad);
    tests.push({ kind, p: inp.value, bad });
  });
  const chipErr = v.querySelector(".chip-err");
  if (chipErr) {
    const anyBad = tests.some(t => t.bad);
    chipErr.hidden = !anyBad;
    chipErr.textContent = "Invalid regular expression";
  }

  const count = v.querySelector(".count");
  if (!active) {
    count.textContent = segIdx === 0 ? "Applies to “README.md — alt-tab”" : "All open windows are affected";
    return;
  }
  const mode = v.querySelector(".mode-popup .plabel").dataset.state;
  const good = tests.filter(t => t.p.trim() !== "" && !t.bad);
  const hits = good.length === 0 ? [] : WINDOWS.filter(w => mode === "any" ? good.some(t => pred(t.kind, t.p, w)) : good.every(t => pred(t.kind, t.p, w)));
  count.textContent = hits.length
    ? hits.length + " of " + WINDOWS.length + " open windows match right now"
    : "No open windows match right now";
  const pv = v.querySelector(".pvsub");
  if (pv) pv.textContent = hits.length ? hits[0] : "no match right now";
}

function autosize(el) {
  if (el.classList.contains("cpat")) el.style.width = (Math.max(el.value.length, 3) + 1) + "ch";
}

function initVariant(v) {
  v.addEventListener("click", e => {
    const kp = e.target.closest(".kind-popup");
    if (kp) {
      const cur = kp.querySelector(".plabel").textContent.trim();
      openMenu(kp, KINDS, cur, k => {
        kp.querySelector(".plabel").textContent = k;
        const inp = kp.closest(".mrow").querySelector(".pattern");
        inp.classList.toggle("mono", k === "Regex");
        inp.placeholder = k === "Regex" ? "Regular expression" : "Window title";
        refresh(v);
      });
      return;
    }
    const ck = e.target.closest(".ckind");
    if (ck) {
      const chip = ck.closest(".chip");
      openMenu(ck, KINDS, chip.dataset.kind, k => {
        chip.dataset.kind = k;
        ck.textContent = k;
        chip.querySelector(".cpat").classList.toggle("mono", k === "Regex");
        refresh(v);
      });
      return;
    }
    const mp = e.target.closest(".mode-popup");
    if (mp) {
      const lbl = mp.querySelector(".plabel");
      openMenu(mp, ["any", "all"], lbl.dataset.state, k => {
        lbl.textContent = k;
        lbl.dataset.state = k;
        refresh(v);
      });
      return;
    }
    const add = e.target.closest(".add-matcher");
    if (add) {
      if (v.dataset.variant === "c") {
        openMenu(add, KINDS, null, k => {
          const input = v.querySelector(".chipinput");
          input.insertAdjacentHTML("beforebegin", chipHTML(k, ""));
          refresh(v);
          v.querySelector(".chipbox .chip:last-of-type .cpat").focus();
        });
      } else {
        const m = v.querySelector(".matchers");
        m.insertAdjacentHTML("beforeend", rowHTML("Contains", ""));
        refresh(v);
        m.lastElementChild.querySelector(".pattern").focus();
      }
      return;
    }
    const rm = e.target.closest(".remove-matcher");
    if (rm) { rm.closest(".mrow-wrap").remove(); refresh(v); return; }
    const cx = e.target.closest(".cx");
    if (cx) { cx.closest(".chip").remove(); refresh(v); return; }
    const seg = e.target.closest(".seg-item");
    if (seg) {
      v.querySelectorAll(".seg-item").forEach(s => s.classList.remove("sel"));
      seg.classList.add("sel");
      refresh(v);
    }
  });
  v.addEventListener("input", e => {
    if (e.target.classList.contains("pattern") || e.target.classList.contains("cpat")) {
      autosize(e.target);
      refresh(v);
    }
  });
  v.addEventListener("keydown", e => {
    if (e.target.classList.contains("chipinput") && e.key === "Enter" && e.target.value.trim() !== "") {
      e.target.insertAdjacentHTML("beforebegin", chipHTML("Contains", e.target.value));
      e.target.value = "";
      refresh(v);
    }
  });
  refresh(v);
}

/* ---- assemble + wire ---- */
document.querySelectorAll(".variant").forEach(v => { v.innerHTML = windowHTML(v.dataset.variant); });
document.querySelectorAll(".variant").forEach(v => initVariant(v));

function showVariant(id) {
  document.querySelectorAll(".variant").forEach(x => x.classList.toggle("active", x.dataset.variant === id));
  document.querySelectorAll(".variant-tab").forEach(t => t.classList.toggle("active", t.dataset.v === id));
  try { history.replaceState(null, "", "#" + id); } catch (_) { location.hash = id; }
}
document.querySelectorAll(".variant-tab").forEach(t => t.addEventListener("click", () => showVariant(t.dataset.v)));
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (["a", "b", "c"].includes(id)) showVariant(id);
});
showVariant(["a", "b", "c"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "a");

/* ---- sketch toolbar ---- */
document.querySelectorAll("#sketch-tools [data-zoom]").forEach(b => b.addEventListener("click", () => {
  document.querySelector(".stage").style.transform = "scale(" + b.dataset.zoom + ")";
  document.querySelectorAll("#sketch-tools [data-zoom]").forEach(x => x.classList.toggle("on", x === b));
}));
document.getElementById("ann-toggle").addEventListener("click", e => {
  document.body.classList.toggle("annotate");
  e.target.classList.toggle("on");
});
</script>
