name: Release

# Every v* tag becomes a release: universal build, Developer ID signed,
# notarized, stapled DMG published as AltTab.dmg on the GitHub Release, then
# the pinned Homebrew cask (yurifrl/homebrew-casks) is bumped to it.
# The `latest` cask needs no bump: it points at releases/latest/download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Signing gate and keychain setup
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_APPLICATION:?repo var DEVELOPER_ID_APPLICATION is required}"
          : "${MACOS_SIGNING_P12_BASE64:?secret MACOS_SIGNING_P12_BASE64 is required}"
          : "${MACOS_SIGNING_P12_PASSWORD:?secret MACOS_SIGNING_P12_PASSWORD is required}"
          : "${ASC_API_KEY_P8_BASE64:?secret ASC_API_KEY_P8_BASE64 is required}"
          : "${ASC_KEY_ID:?secret ASC_KEY_ID is required}"
          : "${ASC_ISSUER_ID:?secret ASC_ISSUER_ID is required}"
          P12_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$MACOS_SIGNING_P12_PASSWORD" -t agg -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$MACOS_SIGNING_P12_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          ASC_P8_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$ASC_P8_PATH"
          echo "ASC_P8_PATH=$ASC_P8_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Derive version from tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "bad tag $TAG" >&2; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build universal binary
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/AltTabCore"
          lipo -info "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Assemble and sign AltTab.app
        run: |
          set -euo pipefail
          APP="build/AltTab.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BIN" "$APP/Contents/MacOS/AltTab"
          cp Support/Info.plist "$APP/Contents/Info.plist"
          mkdir -p "$APP/Contents/Resources"
          cp Support/AppIcon.icns Support/MenuBarIconTemplate*.png "$APP/Contents/Resources/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force --timestamp --options runtime \
            --keychain "$KEYCHAIN_PATH" --sign "$DEVELOPER_ID_APPLICATION" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          APP="build/AltTab.app"
          ditto -c -k --keepParent "$APP" build/AltTab-app.zip
          LOG="$RUNNER_TEMP/notary-app.log"
          set +e
          xcrun notarytool submit build/AltTab-app.zip \
            --key "$ASC_P8_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 ]] || grep -qi 'status:[[:space:]]*Invalid' "$LOG"; then
            SUB_ID="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$LOG" | head -1 || true)"
            [[ -z "$SUB_ID" ]] || xcrun notarytool log "$SUB_ID" \
              --key "$ASC_P8_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            exit 1
          fi
          for attempt in 1 2 3; do
            xcrun stapler staple "$APP" && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 15))
          done
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP"

      - name: Create, sign and notarize the DMG
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/dmg-payload"
          mkdir -p "$PAYLOAD"
          ditto build/AltTab.app "$PAYLOAD/AltTab.app"
          ln -s /Applications "$PAYLOAD/Applications"
          DMG="AltTab.dmg"
          hdiutil create -volname "AltTab" -srcfolder "$PAYLOAD" -ov -format UDZO "$DMG"
          codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$DEVELOPER_ID_APPLICATION" "$DMG"
          LOG="$RUNNER_TEMP/notary-dmg.log"
          set +e
          xcrun notarytool submit "$DMG" \
            --key "$ASC_P8_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ $rc -ne 0 ]] || grep -qi 'status:[[:space:]]*Invalid' "$LOG"; then exit 1; fi
          for attempt in 1 2 3; do
            xcrun stapler staple "$DMG" && break
            [[ $attempt -lt 3 ]] || exit 1
            sleep $((attempt * 15))
          done
          xcrun stapler validate "$DMG"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "SHA256=$SHA" >> "$GITHUB_ENV"
          echo "$SHA  $DMG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AltTab.dmg --clobber
          else
            gh release create "$TAG" AltTab.dmg --verify-tag --generate-notes --title "AltTab $VERSION"
          fi

      - name: Bump pinned Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; pinned cask not bumped (latest cask is unaffected)"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/yurifrl/homebrew-casks.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          CASK="Casks/yurifrl-alt-tab.rb"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git diff --cached --quiet && { echo "cask already up to date"; exit 0; }
          git commit -m "yurifrl-alt-tab $VERSION"
          git push origin HEAD
