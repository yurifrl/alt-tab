name: Release

# Every v* tag becomes a release: a universal build, Developer ID signed and
# notarized, published as AltTab.dmg plus a signed appcast.xml on the GitHub
# Release, with the pinned Homebrew cask bumped to it. The step bodies live in
# .github/actions/* so the nightly workflow runs the same pipeline.
# The `latest` cask needs no bump: it points at releases/latest/download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  # Serialize releases; never cancel one mid-flight.
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # Full history: release-notes.sh lists commits since the previous tag.
          fetch-depth: 0

      - name: Gate on release-only configuration
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_APPLICATION:?repo var DEVELOPER_ID_APPLICATION is required}"
          : "${HOMEBREW_TAP_TOKEN:?secret HOMEBREW_TAP_TOKEN is required - the pinned cask must be bumped}"
          : "${SPARKLE_ED_PRIVATE_KEY:?secret SPARKLE_ED_PRIVATE_KEY is required - the appcast must be signed}"

      - name: Set up signing and notarization
        id: signing
        uses: ./.github/actions/setup-signing
        with:
          signing-identity: ${{ env.DEVELOPER_ID_APPLICATION }}
          p12-base64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          asc-key-p8-base64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Derive version and build number
        id: meta
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9] ]] || { echo "bad tag $TAG" >&2; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # UTC timestamp instead of the run number: it orders builds across the
          # release and nightly workflows, whose counters are separate.
          echo "build=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and sign AltTab.app
        id: build
        uses: ./.github/actions/build-app
        with:
          version: ${{ steps.meta.outputs.version }}
          build-number: ${{ steps.meta.outputs.build }}
          signing-identity: ${{ env.DEVELOPER_ID_APPLICATION }}
          keychain-path: ${{ steps.signing.outputs.keychain-path }}

      - name: Notarize and staple the app
        uses: ./.github/actions/notarize-app
        with:
          app-path: ${{ steps.build.outputs.app-path }}
          asc-key-path: ${{ steps.signing.outputs.asc-key-path }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Package, sign and notarize the DMG
        id: package
        uses: ./.github/actions/package-dmg
        with:
          app-path: ${{ steps.build.outputs.app-path }}
          dmg-name: AltTab.dmg
          volname: AltTab
          signing-identity: ${{ env.DEVELOPER_ID_APPLICATION }}
          keychain-path: ${{ steps.signing.outputs.keychain-path }}
          asc-key-path: ${{ steps.signing.outputs.asc-key-path }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}

      - name: Assemble the release notes
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$TAG" "$TAG" RELEASE_NOTES.md

      - name: Generate the signed Sparkle appcast
        id: appcast
        uses: ./.github/actions/appcast
        with:
          dmg-path: ${{ steps.package.outputs.dmg-path }}
          notes-name: AltTab
          notes-path: RELEASE_NOTES.md
          download-url-prefix: https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/
          sparkle-ed-key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPCAST: ${{ steps.appcast.outputs.appcast-path }}
          DMG: ${{ steps.package.outputs.dmg-path }}
          TITLE: AltTab ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "$DMG" "$APPCAST" --clobber
          else
            gh release create "$TAG" "$DMG" "$APPCAST" --verify-tag --notes-file RELEASE_NOTES.md --title "$TITLE"
          fi

      - name: Bump pinned Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          : "${TAP_TOKEN:?secret HOMEBREW_TAP_TOKEN is required - the pinned cask must be bumped}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/yurifrl/homebrew-casks.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          CASK="Casks/yurifrl-alt-tab.rb"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git diff --cached --quiet && { echo "cask already up to date"; exit 0; }
          git commit -m "yurifrl-alt-tab $VERSION"
          git push origin HEAD

      - name: Stamp the released section in CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has [$VERSION]; nothing to stamp"
            exit 0
          fi
          git fetch origin main
          if ! git diff --quiet "$TAG" origin/main -- CHANGELOG.md; then
            echo "::warning::CHANGELOG.md changed on main since $TAG; skipping the stamp (move the released bullets under [$VERSION] manually)"
            exit 0
          fi
          git checkout -B main origin/main
          awk -v ver="$VERSION" -v d="$(date -u +%F)" '
            !done && $0 == "## [Unreleased]" { print; print ""; print "## [" ver "] - " d; done = 1; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): stamp $TAG"
          git push origin main

      - name: Remove the temporary keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN_PATH:-}" ]] || exit 0
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
